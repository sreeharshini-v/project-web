<!DOCTYPE html>
<html>
<head>
    <title>Remove Element</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #message {
            background-color: lightblue;
            padding: 25px;
            margin: 30px auto;
            width: 300px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1>Remove HTML Element</h1>

    <div id="message">
        This element will be removed.
    </div>

    <button onclick="removeElement()">
        Remove Element
    </button>

    <script>
        function removeElement() {

            let element = document.getElementById("message");

            if (element) {
                element.remove();
            }
        }
    </script>

</body>
</html>
