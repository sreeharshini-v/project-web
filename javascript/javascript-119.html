<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<div class="container">

    <h2>BMI Calculator</h2>

    <input type="number" id="weight"
           placeholder="Weight in kg">

    <input type="number" id="height"
           placeholder="Height in cm">

    <button onclick="calculateBMI()">Calculate BMI</button>

    <div id="result"></div>

</div>

<script>
    function calculateBMI() {

        let weight =
            Number(document.getElementById("weight").value);

        let heightCm =
            Number(document.getElementById("height").value);

        if (weight <= 0 || heightCm <= 0) {
            document.getElementById("result").textContent =
                "Please enter valid values.";
            return;
        }

        let heightM = heightCm / 100;

        let bmi =
            weight / (heightM * heightM);

        let category;

        if (bmi < 18.5) {
            category = "Underweight";
        } else if (bmi < 25) {
            category = "Normal range";
        } else if (bmi < 30) {
            category = "Overweight";
        } else {
            category = "Obesity range";
        }

        document.getElementById("result").innerHTML =
            "<strong>BMI:</strong> " +
            bmi.toFixed(2) +
            "<br><strong>Category:</strong> " +
            category;
    }
</script>

</body>
</html>
