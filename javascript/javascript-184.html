<h2>Double-Click Counter</h2>

<button id="button">Double Click Me</button>

<h3>Double Clicks: <span id="count">0</span></h3>

<script>
let count = 0;

document.getElementById("button").addEventListener("dblclick", function() {

    count++;

    document.getElementById("count").textContent = count;
});
</script>

</body>
