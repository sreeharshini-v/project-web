<!DOCTYPE html>
<html>
<head>
    <title>Searchable Table</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        input {
            width: 300px;
            max-width: 100%;
            padding: 12px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #333;
            color: white;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


    <h1>Searchable Student Table</h1>

    <input type="text"
           id="search"
           placeholder="Search student..."
           onkeyup="searchTable()">

    <table id="studentTable">

        <thead>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Anu</td>
                <td>BCA</td>
                <td>85</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>B.Sc</td>
                <td>90</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>BCA</td>
                <td>78</td>
            </tr>

            <tr>
                <td>Kiran</td>
                <td>B.Tech</td>
                <td>92</td>
            </tr>

            <tr>
                <td>Sneha</td>
                <td>B.Com</td>
                <td>75</td>
            </tr>

        </tbody>

    </table>

    <script>
        function searchTable() {

            let search =
                document.getElementById("search")
                    .value.toLowerCase();

            let rows =
                document.querySelectorAll(
                    "#studentTable tbody tr"
                );

            rows.forEach(function(row) {

                let text =
                    row.textContent.toLowerCase();

                if (text.includes(search)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>
