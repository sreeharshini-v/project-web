<!DOCTYPE html>
<html>
<head>
    <title>Count Digits</title>
</head>
<body>

<h2>Count Number of Digits</h2>

<input type="number" id="number" placeholder="Enter Number">

<button onclick="countDigits()">Count</button>

<p id="output"></p>

<script>
function countDigits() {

    let number = Number(
        document.getElementById("number").value
    );

    let digits = Math.abs(number).toString().length;

    document.getElementById("output").innerHTML =
        "Number of digits = " + digits;
}
</script>

</body>
</html>
