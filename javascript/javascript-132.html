<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            font-family: Arial;
            width: 400px;
            margin: 50px auto;
        }

        li {
            padding: 10px;
            background-color: #eee;
            margin: 5px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">

    <h1>Student Names</h1>

    <ul id="studentList"></ul>

    <script>
        let students = [
            "Anu",
            "Rahul",
            "Priya",
            "Kiran",
            "Sneha"
        ];

        let list =
            document.getElementById("studentList");

        students.forEach(function(student) {

            let li = document.createElement("li");

            li.textContent = student;

            list.appendChild(li);
        });
    </script>

</body>
</html>
