<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            font-family: Arial;

            background-color: #f2f2f2;
        }

        .container {
            width: 500px;

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">

<div class="container">

    <h2>JavaScript Window Object</h2>

    <button onclick="showWindowInfo()">Show Window Information</button>
    <button onclick="openWindow()">Open New Window</button>
    <button onclick="showAlert()">Show Alert</button>

    <div id="output"></div>

</div>

<script>
    function showWindowInfo() {

        let output = document.getElementById("output");

        output.innerHTML =
            "<strong>Window Width:</strong> " + window.innerWidth + " px<br>" +
            "<strong>Window Height:</strong> " + window.innerHeight + " px<br>" +
            "<strong>Screen Width:</strong> " + window.screen.width + " px<br>" +
            "<strong>Screen Height:</strong> " + window.screen.height + " px<br>" +
            "<strong>Current URL:</strong> " + window.location.href;
    }

    function openWindow() {
        window.open(
            "https://www.example.com",
            "_blank",
            "width=600,height=400"
        );
    }

    function showAlert() {
        window.alert("This is a JavaScript Window Object example!");
    }
</script>

</body>
</html>
