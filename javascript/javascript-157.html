<!DOCTYPE html>
<html>
<head>
    <title>onclick Event</title>
</head>
<body>

<h2>onclick Event</h2>

<button onclick="showMessage()">Click Me</button>

<p id="message"></p>

<script>
function showMessage() {
    document.getElementById("message").textContent =
        "Button was clicked!";
}
</script>

</body>
</html>
