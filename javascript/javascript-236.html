<!DOCTYPE html>
<html>
<head>
    <title>Current URL</title>
</head>
<body>

<h2>Current Webpage URL</h2>

<button onclick="showURL()">Show URL</button>

<p id="url"></p>

<script>
function showURL() {
    document.getElementById("url").innerHTML =
        window.location.href;
}
</script>

</body>
</html>
