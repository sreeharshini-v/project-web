<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        #success {
            color: green;
            text-align: center;
            margin-top: 15px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<div class="container">
    <h2>Student Registration</h2>

    <form id="registrationForm">

        <label>Name:</label>
        <input type="text" id="name">
        <div class="error" id="nameError"></div>

        <label>Email:</label>
        <input type="text" id="email">
        <div class="error" id="emailError"></div>

        <label>Phone:</label>
        <input type="text" id="phone">
        <div class="error" id="phoneError"></div>

        <label>Age:</label>
        <input type="number" id="age">
        <div class="error" id="ageError"></div>

        <label>Course:</label>
        <select id="course">
            <option value="">Select Course</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>B.Tech</option>
            <option>MCA</option>
        </select>
        <div class="error" id="courseError"></div>

        <button type="submit">Register</button>

        <div id="success"></div>
    </form>
</div>

<script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let age = document.getElementById("age").value;
        let course = document.getElementById("course").value;

        document.querySelectorAll(".error").forEach(function(element) {
            element.textContent = "";
        });

        document.getElementById("success").textContent = "";

        let valid = true;

        if (name === "") {
            document.getElementById("nameError").textContent = "Name is required";
            valid = false;
        }

        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if (email === "") {
            document.getElementById("emailError").textContent = "Email is required";
            valid = false;
        } else if (!emailPattern.test(email)) {
            document.getElementById("emailError").textContent = "Enter a valid email";
            valid = false;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            document.getElementById("phoneError").textContent =
                "Enter a valid 10-digit phone number";
            valid = false;
        }

        if (age === "" || age < 17 || age > 60) {
            document.getElementById("ageError").textContent =
                "Age must be between 17 and 60";
            valid = false;
        }

        if (course === "") {
            document.getElementById("courseError").textContent =
                "Please select a course";
            valid = false;
        }

        if (valid) {
            document.getElementById("success").textContent =
                "Registration successful!";
        }
    });
</script>

</body>
</html>
