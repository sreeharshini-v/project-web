<!DOCTYPE html>
<html>
<head>
    <title>Job Application</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>

</nav>


<h2>Job Application Form</h2>

<form id="form">

    <input type="text" id="name" placeholder="Full Name"><br><br>

    <input type="email" id="email" placeholder="Email"><br><br>

    <input type="text" id="phone" placeholder="Phone"><br><br>

    <select id="job">
        <option value="">Select Job</option>
        <option>Web Developer</option>
        <option>Software Developer</option>
        <option>Data Analyst</option>
    </select>

    <br><br>

    <input type="number" id="experience"
        placeholder="Experience in years">

    <br><br>

    <button type="submit">Apply</button>
</form>

<p id="message"></p>

<script>
document.getElementById("form").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const job = document.getElementById("job").value;
    const experience = document.getElementById("experience").value;

    if (!/^[A-Za-z ]+$/.test(name)) {
        alert("Enter a valid name.");
        return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert("Enter a valid email.");
        return;
    }

    if (!/^[6-9][0-9]{9}$/.test(phone)) {
        alert("Enter a valid phone number.");
        return;
    }

    if (job === "") {
        alert("Select a job.");
        return;
    }

    if (experience === "" || experience < 0) {
        alert("Enter valid experience.");
        return;
    }

    document.getElementById("message").textContent =
        "Job application submitted successfully!";
});
</script>

</body>
</html>
