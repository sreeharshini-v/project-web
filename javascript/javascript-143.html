<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Image Gallery</title>

    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .gallery img {
            width: 200px;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h2>Dynamic Image Gallery</h2>

<div id="gallery" class="gallery"></div>

<script>
const images = [
    {
        src: "https://picsum.photos/id/1015/400/300",
        title: "Mountain"
    },
    {
        src: "https://picsum.photos/id/1016/400/300",
        title: "River"
    },
    {
        src: "https://picsum.photos/id/1025/400/300",
        title: "Dog"
    },
    {
        src: "https://picsum.photos/id/1035/400/300",
        title: "Forest"
    }
];

const gallery = document.getElementById("gallery");

images.forEach(function (image) {
    const div = document.createElement("div");

    const img = document.createElement("img");
    img.src = image.src;
    img.alt = image.title;

    const heading = document.createElement("p");
    heading.textContent = image.title;

    div.appendChild(img);
    div.appendChild(heading);

    gallery.appendChild(div);
});
</script>

</body>
</html>
