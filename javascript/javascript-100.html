<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #eef2f3;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>JavaScript History Object</h2>

    <p>History Length:</p>
    <h3 id="length"></h3>

    <button onclick="goBack()">Go Back</button>
    <button onclick="goForward()">Go Forward</button>
    <button onclick="goTwoPagesBack()">Go 2 Pages Back</button>

    <div id="output"></div>

</div>

<script>
    function showHistoryLength() {
        document.getElementById("length").textContent =
            history.length;
    }

    function goBack() {
        history.back();
    }

    function goForward() {
        history.forward();
    }

    function goTwoPagesBack() {
        history.go(-2);
    }

    showHistoryLength();
</script>

</body>
</html>
