<!DOCTYPE html>
<html>
<head>
    <title>Display API Data</title>

    <style>
        .card {
            border: 1px solid #333;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Users from API</h2>

<button onclick="loadUsers()">Load Users</button>

<div id="users"></div>

<script>
async function loadUsers() {

    try {
        let response = await fetch(
            "https://jsonplaceholder.typicode.com/users"
        );

        let users = await response.json();

        let output = "";

        users.forEach(function(user) {
            output += `
                <div class="card">
                    <h3>${user.name}</h3>
                    <p>Email: ${user.email}</p>
                    <p>City: ${user.address.city}</p>
                    <p>Phone: ${user.phone}</p>
                </div>
            `;
        });

        document.getElementById("users").innerHTML = output;

    } catch (error) {
        document.getElementById("users").innerHTML =
            "Unable to load data.";
    }
}
</script>

</body>
</html>
