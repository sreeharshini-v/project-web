<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px;
        }

        .product {
            width: 200px;
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            border: none;
            background-color: green;
            color: white;
        }

        .cart {
            width: 500px;
            max-width: 90%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .remove {
            background-color: red;
        }

        #total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
        }

        #clearCart {
            background-color: #555;
            width: 100%;
            margin-top: 10px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<header>
    <h1>Simple Shopping Cart</h1>
</header>

<div class="products">

    <div class="product">
        <h3>Laptop</h3>
        <p>₹50,000</p>
        <button onclick="addToCart('Laptop', 50000)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Headphones</h3>
        <p>₹2,000</p>
        <button onclick="addToCart('Headphones', 2000)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Keyboard</h3>
        <p>₹1,500</p>
        <button onclick="addToCart('Keyboard', 1500)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Mouse</h3>
        <p>₹800</p>
        <button onclick="addToCart('Mouse', 800)">
            Add to Cart
        </button>
    </div>

</div>

<div class="cart">

    <h2>Shopping Cart</h2>

    <div id="cartItems"></div>

    <p id="total">Total: ₹0</p>

    <button id="clearCart" onclick="clearCart()">
        Clear Cart
    </button>

</div>

<script>
    let cart = JSON.parse(localStorage.getItem("shoppingCart")) || [];

    function saveCart() {
        localStorage.setItem(
            "shoppingCart",
            JSON.stringify(cart)
        );
    }

    function addToCart(name, price) {

        let existingItem = cart.find(function(item) {
            return item.name === name;
        });

        if (existingItem) {
            existingItem.quantity++;
        } else {
            cart.push({
                name: name,
                price: price,
                quantity: 1
            });
        }

        saveCart();
        displayCart();
    }

    function removeFromCart(index) {

        cart.splice(index, 1);

        saveCart();
        displayCart();
    }

    function clearCart() {

        cart = [];

        saveCart();
        displayCart();
    }

    function displayCart() {

        let cartItems = document.getElementById("cartItems");

        cartItems.innerHTML = "";

        let total = 0;

        if (cart.length === 0) {
            cartItems.innerHTML =
                "<p>Your cart is empty.</p>";
        }

        cart.forEach(function(item, index) {

            let itemTotal = item.price * item.quantity;

            total += itemTotal;

            cartItems.innerHTML +=
                '<div class="cart-item">' +
                '<span>' +
                item.name +
                ' × ' +
                item.quantity +
                ' = ₹' +
                itemTotal +
                '</span>' +
                '<button class="remove" onclick="removeFromCart(' +
                index +
                ')">Remove</button>' +
                '</div>';
        });

        document.getElementById("total").textContent =
            "Total: ₹" + total;
    }

    displayCart();
</script>

</body>
</html>
