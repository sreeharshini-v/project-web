<!DOCTYPE html>
<html>
<head>
    <title>Toggle CSS Class</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #box {
            padding: 30px;
            width: 300px;
            margin: 30px auto;
            background-color: lightgray;
        }

        .active {
            background-color: blue !important;
            color: white;
            border-radius: 20px;
            font-size: 25px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


    <div id="box">
        Click the button to toggle the class.
    </div>

    <button onclick="toggleClass()">
        Toggle Class
    </button>

    <script>
        function toggleClass() {

            document.getElementById("box")
                .classList.toggle("active");
        }
    </script>

</body>
</html>
