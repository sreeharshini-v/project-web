<!DOCTYPE html>
<html>
<head>
    <title>Image Slideshow</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .slideshow {
            max-width: 600px;
            margin: 30px auto;
        }

        .slideshow img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Image Slideshow / Carousel</h2>

<div class="slideshow">

    <img id="slide"
         src="https://via.placeholder.com/600x300?text=Image+1"
         alt="Slideshow Image">

</div>

<button onclick="previousImage()">Previous</button>
<button onclick="nextImage()">Next</button>

<script>
let images = [
    "https://via.placeholder.com/600x300?text=Image+1",
    "https://via.placeholder.com/600x300?text=Image+2",
    "https://via.placeholder.com/600x300?text=Image+3",
    "https://via.placeholder.com/600x300?text=Image+4"
];

let currentIndex = 0;

function showImage() {

    document.getElementById("slide").src =
        images[currentIndex];
}

function nextImage() {

    currentIndex++;

    if (currentIndex >= images.length) {
        currentIndex = 0;
    }

    showImage();
}

function previousImage() {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = images.length - 1;
    }

    showImage();
}

// Automatically change image every 3 seconds
setInterval(nextImage, 3000);
</script>

</body>
</html>
