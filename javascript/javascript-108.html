<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef2f3;
        }

        .container {
            margin-top: 100px;
        }

        input {
            padding: 12px;
            width: 100px;
            font-size: 18px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #display {
            font-size: 60px;
            margin: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Countdown Timer</h1>

    <input type="number" id="secondsInput"
           placeholder="Seconds" min="1">

    <br>

    <button onclick="startTimer()">Start</button>
    <button onclick="resetTimer()">Reset</button>

    <div id="display">00:00</div>

</div>

<script>
    let timeLeft = 0;
    let timer = null;

    function updateDisplay() {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        document.getElementById("display").textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");
    }

    function startTimer() {

        if (timer !== null) {
            return;
        }

        if (timeLeft === 0) {
            timeLeft = Number(
                document.getElementById("secondsInput").value
            );
        }

        if (timeLeft <= 0) {
            alert("Please enter a valid number of seconds.");
            return;
        }

        updateDisplay();

        timer = setInterval(function() {

            timeLeft--;
            updateDisplay();

            if (timeLeft <= 0) {
                clearInterval(timer);
                timer = null;
                alert("Time is up!");
            }

        }, 1000);
    }

    function resetTimer() {

        clearInterval(timer);
        timer = null;
        timeLeft = 0;

        document.getElementById("secondsInput").value = "";
        updateDisplay();
    }
</script>

</body>
</html>
