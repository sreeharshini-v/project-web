<!DOCTYPE html>
<html>
<head>
    <title>Multi-Step Registration</title>

    <style>
        .step {
            display: none;
        }

        .active {
            display: block;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Multi-Step Registration</h2>

<form id="form">

    <div class="step active" id="step1">
        <h3>Step 1: Personal Details</h3>

        <input type="text" id="name" placeholder="Name">

        <br><br>

        <button type="button" onclick="nextStep(2)">
            Next
        </button>
    </div>

    <div class="step" id="step2">
        <h3>Step 2: Contact Details</h3>

        <input type="email" id="email" placeholder="Email">

        <br><br>

        <button type="button" onclick="nextStep(1)">
            Previous
        </button>

        <button type="button" onclick="nextStep(3)">
            Next
        </button>
    </div>

    <div class="step" id="step3">
        <h3>Step 3: Password</h3>

        <input type="password" id="password"
            placeholder="Password">

        <br><br>

        <button type="button" onclick="nextStep(2)">
            Previous
        </button>

        <button type="submit">
            Register
        </button>
    </div>

</form>

<p id="message"></p>

<script>
function nextStep(stepNumber) {

    const steps = document.querySelectorAll(".step");

    steps.forEach(function(step) {
        step.classList.remove("active");
    });

    document.getElementById("step" + stepNumber)
        .classList.add("active");
}

document.getElementById("form").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (name === "" || email === "" || password.length < 6) {
        document.getElementById("message").textContent =
            "Please enter valid details.";
        return;
    }

    document.getElementById("message").textContent =
        "Registration completed successfully!";
});
</script>

</body>
</html>
