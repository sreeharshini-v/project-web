<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Checker</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        #strength {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<div class="container">
    <h2>Password Strength Checker</h2>

    <input type="password" id="password"
           placeholder="Enter password">

    <p id="strength">Password strength will appear here</p>
</div>

<script>
    document.getElementById("password").addEventListener("input", function() {

        let password = this.value;
        let strength = document.getElementById("strength");

        if (password.length === 0) {
            strength.textContent = "Enter a password";
        }
        else if (password.length < 6) {
            strength.textContent = "Weak Password";
        }
        else if (
            password.length >= 6 &&
            /[A-Z]/.test(password) &&
            /[0-9]/.test(password)
        ) {
            strength.textContent = "Strong Password";
        }
        else {
            strength.textContent = "Medium Password";
        }
    });
</script>

</body>
</html>
