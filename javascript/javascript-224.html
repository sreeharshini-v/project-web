<h2>Shopping Order Form</h2>

<select id="product">
    <option value="">Select Product</option>
    <option value="500">Shirt - ₹500</option>
    <option value="800">Jeans - ₹800</option>
    <option value="1200">Shoes - ₹1200</option>
</select>

<br><br>

<input type="number" id="quantity"
    placeholder="Quantity" min="1">

<br><br>

<button onclick="calculate()">Calculate Total</button>

<p id="result"></p>

<script>
function calculate() {

    const price = Number(document.getElementById("product").value);
    const quantity = Number(document.getElementById("quantity").value);

    if (price === 0 || quantity < 1) {
        document.getElementById("result").textContent =
            "Select a product and enter valid quantity.";
        return;
    }

    const total = price * quantity;

    document.getElementById("result").textContent =
        "Total Price: ₹" + total;
}
</script>

</body>
</html>
