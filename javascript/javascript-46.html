<!DOCTYPE html>
<html>
<head>
    <title>Responsive Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f2f2f2;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .login-box {
                margin: 30px auto;
                padding: 20px;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<div class="login-box">

    <h2>Login</h2>

    <form onsubmit="return validateLogin()">

        <input type="email"
               id="email"
               placeholder="Enter Email">

        <input type="password"
               id="password"
               placeholder="Enter Password">

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

</div>

<script>
function validateLogin() {

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        document.getElementById("message").innerHTML =
            "Enter a valid email.";
        return false;
    }

    if (password.length < 6) {
        document.getElementById("message").innerHTML =
            "Password must contain at least 6 characters.";
        return false;
    }

    document.getElementById("message").innerHTML =
        "Login successful!";

    return false;
}
</script>

</body>
</html>
