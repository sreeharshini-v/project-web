<h2 id="heading">Original Heading</h2>

<p class="message">Message One</p>
<p class="message">Message Two</p>
<p class="message">Message Three</p>

<button onclick="changeElements()">Change</button>

<script>
function changeElements() {

    // getElementById()
    let heading = document.getElementById("heading");

    heading.innerHTML =
        "Heading changed using getElementById()";

    // getElementsByClassName()
    let messages =
        document.getElementsByClassName("message");

    for (let message of messages) {

        message.style.color = "green";

        message.innerHTML =
            "Changed using getElementsByClassName()";
    }
}
</script>

</body>
