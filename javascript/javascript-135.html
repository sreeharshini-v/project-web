<!DOCTYPE html>
<html>
<head>
    <title>Add Table Rows</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 40px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
        }

        table {
            width: 600px;
            max-width: 100%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #333;
            color: white;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


    <h1>Add Table Rows Dynamically</h1>

    <input type="text" id="name"
           placeholder="Student Name">

    <input type="text" id="course"
           placeholder="Course">

    <input type="number" id="marks"
           placeholder="Marks">

    <button onclick="addRow()">Add Row</button>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

    <script>
        function addRow() {

            let name =
                document.getElementById("name").value.trim();

            let course =
                document.getElementById("course").value.trim();

            let marks =
                document.getElementById("marks").value;

            if (name === "" || course === "" || marks === "") {
                alert("Please fill all fields.");
                return;
            }

            let table =
                document.getElementById("tableBody");

            let row = table.insertRow();

            row.insertCell(0).textContent = name;
            row.insertCell(1).textContent = course;
            row.insertCell(2).textContent = marks;

            document.getElementById("name").value = "";
            document.getElementById("course").value = "";
            document.getElementById("marks").value = "";
        }
    </script>

</body>
</html>
