<!DOCTYPE html>
<html>
<head>
    <title>CRUD Using Local Storage</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 3px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 500px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Student CRUD Application</h2>

<input type="text" id="name" placeholder="Name">
<input type="number" id="age" placeholder="Age">
<input type="text" id="course" placeholder="Course">

<button onclick="saveStudent()">Save</button>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="studentTable"></tbody>
</table>

<script>

let editIndex = -1;

function getStudents() {
    return JSON.parse(localStorage.getItem("students")) || [];
}


// CREATE
function saveStudent() {

    let name = document.getElementById("name").value;
    let age = document.getElementById("age").value;
    let course = document.getElementById("course").value;

    if (name === "" || age === "" || course === "") {
        alert("Please fill all fields.");
        return;
    }

    let students = getStudents();

    let student = {
        name: name,
        age: age,
        course: course
    };

    if (editIndex === -1) {

        // Create
        students.push(student);

    } else {

        // Update
        students[editIndex] = student;

        editIndex = -1;
    }

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

    clearForm();
    displayStudents();
}


// READ
function displayStudents() {

    let students = getStudents();

    let output = "";

    students.forEach(function(student, index) {

        output += `
            <tr>
                <td>${student.name}</td>
                <td>${student.age}</td>
                <td>${student.course}</td>

                <td>
                    <button onclick="editStudent(${index})">
                        Edit
                    </button>

                    <button onclick="deleteStudent(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });

    document.getElementById("studentTable").innerHTML =
        output;
}


// UPDATE
function editStudent(index) {

    let students = getStudents();

    document.getElementById("name").value =
        students[index].name;

    document.getElementById("age").value =
        students[index].age;

    document.getElementById("course").value =
        students[index].course;

    editIndex = index;
}


// DELETE
function deleteStudent(index) {

    let students = getStudents();

    if (confirm("Are you sure you want to delete this record?")) {

        students.splice(index, 1);

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

        displayStudents();
    }
}


function clearForm() {

    document.getElementById("name").value = "";
    document.getElementById("age").value = "";
    document.getElementById("course").value = "";
}


// Display saved records when page loads
displayStudents();

</script>

</body>
</html>
