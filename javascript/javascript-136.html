<body>

    <h1>Delete Table Row</h1>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tableBody">

            <tr>
                <td>Anu</td>
                <td>BCA</td>
                <td>85</td>
                <td>
                    <button onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>B.Sc</td>
                <td>90</td>
                <td>
                    <button onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>BCA</td>
                <td>78</td>
                <td>
                    <button onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            </tr>

        </tbody>

    </table>

    <script>
        function deleteRow(button) {

            let row = button.parentElement.parentElement;

            row.remove();
        }
    </script>

</body>
