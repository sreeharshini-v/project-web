<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Student Registration Form</h2>

<form id="form">
    <label>Name:</label>
    <input type="text" id="name"><br><br>

    <label>Age:</label>
    <input type="number" id="age"><br><br>

    <label>Email:</label>
    <input type="text" id="email"><br><br>

    <label>Mobile:</label>
    <input type="text" id="mobile"><br><br>

    <label>Password:</label>
    <input type="password" id="password"><br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female<br><br>

    <label>Course:</label>
    <select id="course">
        <option value="">Select Course</option>
        <option>BCA</option>
        <option>B.Tech</option>
        <option>B.Sc</option>
        <option>MCA</option>
    </select><br><br>

    <button type="submit">Register</button>
</form>

<p id="message"></p>

<script>
document.getElementById("form").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value;
    const email = document.getElementById("email").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const password = document.getElementById("password").value;
    const gender = document.querySelector('input[name="gender"]:checked');
    const course = document.getElementById("course").value;
    const message = document.getElementById("message");

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const mobilePattern = /^[0-9]{10}$/;

    if (name === "" || age === "" || email === "" ||
        mobile === "" || password === "" || !gender || course === "") {
        message.textContent = "Please fill all fields.";
        message.style.color = "red";
        return;
    }

    if (!/^[A-Za-z ]+$/.test(name)) {
        message.textContent = "Name must contain only alphabets.";
        message.style.color = "red";
        return;
    }

    if (age < 17 || age > 60) {
        message.textContent = "Enter a valid age.";
        message.style.color = "red";
        return;
    }

    if (!emailPattern.test(email)) {
        message.textContent = "Enter a valid email.";
        message.style.color = "red";
        return;
    }

    if (!mobilePattern.test(mobile)) {
        message.textContent = "Mobile number must contain 10 digits.";
        message.style.color = "red";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must contain at least 6 characters.";
        message.style.color = "red";
        return;
    }

    message.textContent = "Registration successful!";
    message.style.color = "green";
});
</script>

</body>
</html>
