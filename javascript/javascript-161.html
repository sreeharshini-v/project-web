<h2>onmousemove Event</h2>

<div id="area" onmousemove="trackMouse(event)">
    Move the mouse inside this area
</div>

<p id="position"></p>

<script>
function trackMouse(event) {
    document.getElementById("position").textContent =
        "X: " + event.clientX +
        " | Y: " + event.clientY;
}
</script>

</body>
</html>
