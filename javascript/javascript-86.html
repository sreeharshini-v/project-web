<!DOCTYPE html>
<html>
<head>
    <title>Event Bubbling and Capturing</title>

    <style>
        #outer {
            background-color: lightblue;
            padding: 40px;
        }

        #middle {
            background-color: lightgreen;
            padding: 30px;
        }

        #inner {
            background-color: lightyellow;
            padding: 20px;
            cursor: pointer;
        }

        div {
            margin: 10px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">

<h2>Event Bubbling and Capturing</h2>

<div id="outer">

    Outer Div

    <div id="middle">

        Middle Div

        <div id="inner">
            Click Here
        </div>

    </div>

</div>

<p id="output"></p>

<script>
let outer = document.getElementById("outer");
let middle = document.getElementById("middle");
let inner = document.getElementById("inner");
let output = document.getElementById("output");

// Capturing phase
outer.addEventListener("click", function() {
    output.innerHTML += "Outer - Capturing<br>";
}, true);

middle.addEventListener("click", function() {
    output.innerHTML += "Middle - Capturing<br>";
}, true);

// Bubbling phase
inner.addEventListener("click", function() {
    output.innerHTML += "Inner - Target<br>";
});

middle.addEventListener("click", function() {
    output.innerHTML += "Middle - Bubbling<br>";
});

outer.addEventListener("click", function() {
    output.innerHTML += "Outer - Bubbling<br>";
});
</script>

</body>
</html>
