<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Student Table</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


    <h1>Student Table</h1>

    <table>

        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>

    </table>

    <script>
        let students = [
            {
                roll: 1,
                name: "Anu",
                course: "BCA",
                marks: 85
            },
            {
                roll: 2,
                name: "Rahul",
                course: "B.Sc",
                marks: 90
            },
            {
                roll: 3,
                name: "Priya",
                course: "BCA",
                marks: 78
            }
        ];

        let table =
            document.getElementById("studentTable");

        students.forEach(function(student) {

            let row = table.insertRow();

            row.insertCell(0).textContent = student.roll;
            row.insertCell(1).textContent = student.name;
            row.insertCell(2).textContent = student.course;
            row.insertCell(3).textContent = student.marks;
        });
    </script>

</body>
</html>
