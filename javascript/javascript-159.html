<h2>onmouseover and onmouseout</h2>

<div id="box"
     onmouseover="mouseOver()"
     onmouseout="mouseOut()">
    Move Mouse Here
</div>

<p id="message"></p>

<script>
function mouseOver() {
    document.getElementById("message").textContent =
        "Mouse is over the box.";
}

function mouseOut() {
    document.getElementById("message").textContent =
        "Mouse left the box.";
}
</script>

</body>
</html>
