<!DOCTYPE html>
<html>
<head>
    <title>Add and Remove CSS Classes</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        .box {
            padding: 30px;
            width: 300px;
            margin: 30px auto;
            border: 2px solid black;
        }

        .highlight {
            background-color: yellow;
            color: red;
            font-size: 25px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


    <div id="box" class="box">
        CSS class demonstration
    </div>

    <button onclick="addClass()">Add Class</button>

    <button onclick="removeClass()">Remove Class</button>

    <script>
        function addClass() {

            document.getElementById("box")
                .classList.add("highlight");
        }

        function removeClass() {

            document.getElementById("box")
                .classList.remove("highlight");
        }
    </script>

</body>
</html>
