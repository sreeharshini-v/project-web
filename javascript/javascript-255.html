<!DOCTYPE html>
<html>
<head>
    <title>Student Record System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Student Record System</h2>

<input type="text" id="name" placeholder="Student Name">
<input type="number" id="age" placeholder="Age">
<input type="text" id="course" placeholder="Course">

<button onclick="addStudent()">Add Student</button>

<div id="records"></div>

<script>
function addStudent() {
    let students = JSON.parse(localStorage.getItem("students")) || [];

    let student = {
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        course: document.getElementById("course").value
    };

    students.push(student);

    localStorage.setItem("students", JSON.stringify(students));

    displayStudents();
}

function displayStudents() {
    let students = JSON.parse(localStorage.getItem("students")) || [];
    let output = "";

    students.forEach((student, index) => {
        output += `
            <p>
                ${index + 1}. 
                ${student.name} - 
                ${student.age} - 
                ${student.course}
            </p>
        `;
    });

    document.getElementById("records").innerHTML = output;
}

displayStudents();
</script>

</body>
</html>
