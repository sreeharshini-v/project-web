<!DOCTYPE html>
<html>
<head>
    <title>Search Table Records</title>

    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        input {
            padding: 10px;
            width: 300px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Search / Filter Table</h2>

<input type="text"
       id="search"
       placeholder="Search name..."
       onkeyup="filterTable()">

<br><br>

<table id="studentTable">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
    </tr>

    <tr>
        <td>101</td>
        <td>Rahul</td>
        <td>BCA</td>
    </tr>

    <tr>
        <td>102</td>
        <td>Priya</td>
        <td>BSc</td>
    </tr>

    <tr>
        <td>103</td>
        <td>Arun</td>
        <td>BCA</td>
    </tr>

    <tr>
        <td>104</td>
        <td>Divya</td>
        <td>BTech</td>
    </tr>

</table>

<script>
function filterTable() {

    let input = document.getElementById("search")
        .value
        .toLowerCase();

    let table = document.getElementById("studentTable");

    let rows = table.getElementsByTagName("tr");

    for (let i = 1; i < rows.length; i++) {

        let text = rows[i].innerText.toLowerCase();

        if (text.includes(input)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}
</script>

</body>
</html>
