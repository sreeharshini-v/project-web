<!DOCTYPE html>
<html>
<head>
    <title>Change Text Content</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 id="heading">Original Text</h1>

    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() {
            document.getElementById("heading").textContent =
                "Text changed using JavaScript!";
        }
    </script>

</body>
</html>
