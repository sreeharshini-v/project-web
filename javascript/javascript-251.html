<!DOCTYPE html>
<html>
<head>
    <title>Clear Local Storage</title>
</head>
<body>

<h2>Clear Local Storage</h2>

<button onclick="clearStorage()">Clear All Data</button>

<script>
function clearStorage() {
    localStorage.clear();
    alert("All localStorage data has been cleared.");
}
</script>

</body>
</html>
