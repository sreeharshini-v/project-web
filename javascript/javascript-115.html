<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Grade Calculator</h2>

    <input type="number" id="mark1" placeholder="Subject 1">
    <input type="number" id="mark2" placeholder="Subject 2">
    <input type="number" id="mark3" placeholder="Subject 3">
    <input type="number" id="mark4" placeholder="Subject 4">
    <input type="number" id="mark5" placeholder="Subject 5">

    <button onclick="calculateGrade()">Calculate</button>

    <div id="result"></div>

</div>

<script>
    function calculateGrade() {

        let marks = [
            Number(document.getElementById("mark1").value),
            Number(document.getElementById("mark2").value),
            Number(document.getElementById("mark3").value),
            Number(document.getElementById("mark4").value),
            Number(document.getElementById("mark5").value)
        ];

        if (marks.some(mark => mark < 0 || mark > 100)) {
            document.getElementById("result").textContent =
                "Enter marks between 0 and 100.";
            return;
        }

        let total =
            marks.reduce((sum, mark) => sum + mark, 0);

        let average = total / marks.length;

        let grade;

        if (average >= 90) {
            grade = "A+";
        } else if (average >= 80) {
            grade = "A";
        } else if (average >= 70) {
            grade = "B";
        } else if (average >= 60) {
            grade = "C";
        } else if (average >= 50) {
            grade = "D";
        } else {
            grade = "F";
        }

        document.getElementById("result").innerHTML =
            "<strong>Total:</strong> " + total + "/500<br>" +
            "<strong>Average:</strong> " + average.toFixed(2) + "<br>" +
            "<strong>Grade:</strong> " + grade;
    }
</script>

</body>
</html>
