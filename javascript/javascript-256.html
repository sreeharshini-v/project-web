<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>To-Do List</h2>

<input type="text" id="task" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
function getTasks() {
    return JSON.parse(localStorage.getItem("tasks")) || [];
}

function addTask() {
    let task = document.getElementById("task").value;

    if (task === "") return;

    let tasks = getTasks();

    tasks.push(task);

    localStorage.setItem("tasks", JSON.stringify(tasks));

    document.getElementById("task").value = "";

    displayTasks();
}

function deleteTask(index) {
    let tasks = getTasks();

    tasks.splice(index, 1);

    localStorage.setItem("tasks", JSON.stringify(tasks));

    displayTasks();
}

function displayTasks() {
    let tasks = getTasks();
    let output = "";

    tasks.forEach((task, index) => {
        output += `
            <li>
                ${task}
                <button onclick="deleteTask(${index})">Delete</button>
            </li>
        `;
    });

    document.getElementById("taskList").innerHTML = output;
}

displayTasks();
</script>

</body>
</html>
