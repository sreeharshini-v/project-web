<!DOCTYPE html>
<html>
<head>
    <title>Location Object</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        .container {
            width: 550px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            text-align: left;
            line-height: 1.8;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>

<div class="container">

    <h2>JavaScript Location Object</h2>

    <button onclick="showLocation()">Show Location</button>
    <button onclick="reloadPage()">Reload Page</button>
    <button onclick="goToExample()">Go to Example.com</button>

    <div id="output"></div>

</div>

<script>
    function showLocation() {

        let loc = window.location;

        document.getElementById("output").innerHTML =
            "<strong>Complete URL:</strong> " + loc.href + "<br>" +
            "<strong>Protocol:</strong> " + loc.protocol + "<br>" +
            "<strong>Hostname:</strong> " + loc.hostname + "<br>" +
            "<strong>Port:</strong> " + loc.port + "<br>" +
            "<strong>Path:</strong> " + loc.pathname;
    }

    function reloadPage() {
        location.reload();
    }

    function goToExample() {
        location.href = "https://www.example.com";
    }
</script>

</body>
</html>
