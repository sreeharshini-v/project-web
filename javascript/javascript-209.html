<h2>Password Regex Validation</h2>

<input type="password" id="password">
<button onclick="validate()">Validate</button>

<p id="message"></p>

<script>
function validate() {

    const password = document.getElementById("password").value;

    const pattern =
        /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@$!%*?&]).{8,}$/;

    if (pattern.test(password)) {
        document.getElementById("message").textContent =
            "Strong password.";
    } else {
        document.getElementById("message").textContent =
            "Password must have uppercase, lowercase, number, special character and 8+ characters.";
    }
}
</script>
