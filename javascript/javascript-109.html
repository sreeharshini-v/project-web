<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            list-style: none;
            padding: 12px;
            margin: 8px 0;
            background: #eee;
            display: flex;
            justify-content: space-between;
        }

        .delete {
            background: red;
            color: white;
            border: none;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<div class="container">

    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

</div>

<script>
    function addTask() {

        let input = document.getElementById("task");
        let task = input.value.trim();

        if (task === "") {
            alert("Please enter a task.");
            return;
        }

        let li = document.createElement("li");

        li.innerHTML =
            "<span>" + task + "</span>" +
            '<button class="delete" onclick="deleteTask(this)">Delete</button>';

        document.getElementById("taskList").appendChild(li);

        input.value = "";
        input.focus();
    }

    function deleteTask(button) {
        button.parentElement.remove();
    }
</script>

</body>
</html>
