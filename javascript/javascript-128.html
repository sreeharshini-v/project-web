    <h1>Replace HTML Element</h1>

    <div id="oldElement">
        This is the old element.
    </div>

    <button onclick="replaceElement()">
        Replace Element
    </button>

    <script>
        function replaceElement() {

            let oldElement =
                document.getElementById("oldElement");

            let newElement =
                document.createElement("div");

            newElement.textContent =
                "This is the new element!";

            newElement.style.padding = "25px";
            newElement.style.backgroundColor = "lightgreen";
            newElement.style.width = "300px";
            newElement.style.margin = "30px auto";

            oldElement.replaceWith(newElement);
        }
    </script>

</body>
</html>
