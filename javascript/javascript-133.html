<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Ordered List</title>

    <style>
        body {
            font-family: Arial;
            width: 500px;
            margin: 50px auto;
        }

        input {
            padding: 10px;
            width: 70%;
        }

        button {
            padding: 10px;
        }

        li {
            padding: 8px;
        }
    </style>
</head>

<body>

    <h1>Dynamic Ordered List</h1>

    <input type="text"
           id="item"
           placeholder="Enter an item">

    <button onclick="addItem()">Add</button>

    <ol id="list"></ol>

    <script>
        function addItem() {

            let input =
                document.getElementById("item");

            let value = input.value.trim();

            if (value === "") {
                alert("Please enter an item.");
                return;
            }

            let li = document.createElement("li");

            li.textContent = value;

            document.getElementById("list")
                .appendChild(li);

            input.value = "";
            input.focus();
        }
    </script>

</body>
</html>
