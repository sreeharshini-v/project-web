<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .container {
            margin-top: 100px;
        }

        #display {
            font-size: 60px;
            margin: 30px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button onclick="start()">Start</button>
    <button onclick="pause()">Pause</button>
    <button onclick="reset()">Reset</button>

</div>

<script>
    let seconds = 0;
    let timer = null;

    function updateDisplay() {

        let hrs = Math.floor(seconds / 3600);
        let mins = Math.floor((seconds % 3600) / 60);
        let secs = seconds % 60;

        document.getElementById("display").textContent =
            String(hrs).padStart(2, "0") + ":" +
            String(mins).padStart(2, "0") + ":" +
            String(secs).padStart(2, "0");
    }

    function start() {

        if (timer !== null) {
            return;
        }

        timer = setInterval(function() {
            seconds++;
            updateDisplay();
        }, 1000);
    }

    function pause() {

        clearInterval(timer);
        timer = null;
    }

    function reset() {

        clearInterval(timer);
        timer = null;
        seconds = 0;
        updateDisplay();
    }
</script>

</body>
</html>
