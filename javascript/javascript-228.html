<!DOCTYPE html>
<html>
<head>
    <title>Alert Confirm Prompt</title>
</head>
<body>

<h2>Alert, Confirm and Prompt</h2>

<button onclick="showAlert()">Alert</button>
<button onclick="showConfirm()">Confirm</button>
<button onclick="showPrompt()">Prompt</button>

<p id="output"></p>

<script>
function showAlert() {
    alert("Welcome to JavaScript!");
}

function showConfirm() {
    let result = confirm("Do you want to continue?");

    if (result) {
        document.getElementById("output").innerHTML = "You clicked OK.";
    } else {
        document.getElementById("output").innerHTML = "You clicked Cancel.";
    }
}

function showPrompt() {
    let name = prompt("Enter your name:");

    if (name !== null && name !== "") {
        document.getElementById("output").innerHTML =
            "Hello, " + name + "!";
    } else {
        document.getElementById("output").innerHTML =
            "No name entered.";
    }
}
</script>

</body>
</html>
