<!DOCTYPE html>
<html>
<head>
    <title>Change Background Color</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 12px 20px;
        }
    </style>
</head>

<body>

    <h1>Background Color Changer</h1>

    <div id="box">
        Click the button
    </div>

    <button onclick="changeColor()">
        Change Background
    </button>

    <script>
        function changeColor() {

            document.getElementById("box").style.backgroundColor =
                "lightgreen";
        }
    </script>

</body>
</html>
