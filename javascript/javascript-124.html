<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Style</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        #box {
            width: 250px;
            padding: 30px;
            margin: 20px auto;
            background-color: lightblue;
        }

        button {
            padding: 10px 20px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">

    <div id="box">
        Style will change
    </div>

    <button onclick="changeStyle()">
        Change Style
    </button>

    <script>
        function changeStyle() {

            let box = document.getElementById("box");

            box.style.backgroundColor = "orange";
            box.style.color = "white";
            box.style.fontSize = "25px";
            box.style.borderRadius = "15px";
            box.style.padding = "50px";
        }
    </script>

</body>
</html>
