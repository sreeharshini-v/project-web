<!DOCTYPE html>
<html>
<head>
    <title>Marks Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Marks Entry Form</h2>

<input type="number" id="m1" placeholder="Subject 1">
<br><br>

<input type="number" id="m2" placeholder="Subject 2">
<br><br>

<input type="number" id="m3" placeholder="Subject 3">
<br><br>

<input type="number" id="m4" placeholder="Subject 4">
<br><br>

<input type="number" id="m5" placeholder="Subject 5">
<br><br>

<button onclick="calculate()">Calculate</button>

<p id="result"></p>

<script>
function calculate() {

    const marks = [
        Number(document.getElementById("m1").value),
        Number(document.getElementById("m2").value),
        Number(document.getElementById("m3").value),
        Number(document.getElementById("m4").value),
        Number(document.getElementById("m5").value)
    ];

    if (marks.some(mark => mark < 0 || mark > 100)) {
        document.getElementById("result").textContent =
            "Each mark must be between 0 and 100.";
        return;
    }

    const total = marks.reduce((sum, mark) => sum + mark, 0);
    const average = total / marks.length;

    let grade;

    if (average >= 90) {
        grade = "A+";
    } else if (average >= 80) {
        grade = "A";
    } else if (average >= 70) {
        grade = "B";
    } else if (average >= 60) {
        grade = "C";
    } else if (average >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    document.getElementById("result").innerHTML =
        "Total: " + total +
        "<br>Average: " + average.toFixed(2) +
        "<br>Grade: " + grade;
}
</script>

</body>
</html>
