<!DOCTYPE html>
<html>
<head>
    <title>Character Frequency</title>
</head>
<body>

<h2>Character Frequency</h2>

<input type="text" id="text" placeholder="Enter a string">
<button onclick="findFrequency()">Find Frequency</button>

<div id="output"></div>

<script>
function findFrequency() {

    let text = document.getElementById("text").value;
    let frequency = {};

    for (let char of text) {

        if (char === " ") {
            continue;
        }

        if (frequency[char]) {
            frequency[char]++;
        } else {
            frequency[char] = 1;
        }
    }

    let output = "";

    for (let char in frequency) {
        output += char + " : " + frequency[char] + "<br>";
    }

    document.getElementById("output").innerHTML = output;
}
</script>

</body>
</html>
