<!DOCTYPE html>
<html>
<head>
    <title>innerHTML Example</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <div id="content">
        Original content
    </div>

    <br>

    <button onclick="changeContent()">
        Change HTML Content
    </button>

    <script>
        function changeContent() {
            document.getElementById("content").innerHTML =
                "<h2>New Heading</h2>" +
                "<p>This content was added using <b>innerHTML</b>.</p>";
        }
    </script>

</body>
</html>
