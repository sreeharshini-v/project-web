<!DOCTYPE html>
<html>
<head>
    <title>Tabs Interface</title>

    <style>
        .tab {
            padding: 10px 20px;
            cursor: pointer;
        }

        .content {
            display: none;
            padding: 20px;
            border: 1px solid black;
        }

        .active {
            display: block;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h2>Tabs Interface</h2>

<button class="tab" data-target="home">Home</button>
<button class="tab" data-target="about">About</button>
<button class="tab" data-target="contact">Contact</button>

<div id="home" class="content active">
    <h3>Home</h3>
    <p>Welcome to the home page.</p>
</div>

<div id="about" class="content">
    <h3>About</h3>
    <p>This is the about section.</p>
</div>

<div id="contact" class="content">
    <h3>Contact</h3>
    <p>This is the contact section.</p>
</div>

<script>
const tabs = document.querySelectorAll(".tab");
const contents = document.querySelectorAll(".content");

tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {

        contents.forEach(function (content) {
            content.classList.remove("active");
        });

        const target = document.getElementById(this.dataset.target);
        target.classList.add("active");
    });
});
</script>

</body>
</html>
