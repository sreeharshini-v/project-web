<!DOCTYPE html>
<html>
<head>
    <title>Tic-Tac-Toe</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .board {
            width: 300px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .cell {
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
            border: 2px solid #333;
            background: white;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<h1>Tic-Tac-Toe</h1>

<div class="board">

    <button class="cell" onclick="makeMove(0)"></button>
    <button class="cell" onclick="makeMove(1)"></button>
    <button class="cell" onclick="makeMove(2)"></button>

    <button class="cell" onclick="makeMove(3)"></button>
    <button class="cell" onclick="makeMove(4)"></button>
    <button class="cell" onclick="makeMove(5)"></button>

    <button class="cell" onclick="makeMove(6)"></button>
    <button class="cell" onclick="makeMove(7)"></button>
    <button class="cell" onclick="makeMove(8)"></button>

</div>

<p id="message">Player X's turn</p>

<button onclick="resetGame()">Restart Game</button>

<script>
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameOver = false;

    const winningPatterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
    ];

    function makeMove(index) {

        if (board[index] !== "" || gameOver) {
            return;
        }

        board[index] = currentPlayer;

        document.querySelectorAll(".cell")[index].textContent =
            currentPlayer;

        checkWinner();
    }

    function checkWinner() {

        for (let pattern of winningPatterns) {

            let a = pattern[0];
            let b = pattern[1];
            let c = pattern[2];

            if (
                board[a] !== "" &&
                board[a] === board[b] &&
                board[a] === board[c]
            ) {

                document.getElementById("message").textContent =
                    "Player " + currentPlayer + " wins!";

                gameOver = true;
                return;
            }
        }

        if (!board.includes("")) {

            document.getElementById("message").textContent =
                "It's a draw!";

            gameOver = true;
            return;
        }

        currentPlayer =
            currentPlayer === "X" ? "O" : "X";

        document.getElementById("message").textContent =
            "Player " + currentPlayer + "'s turn";
    }

    function resetGame() {

        board = ["", "", "", "", "", "", "", "", ""];
        currentPlayer = "X";
        gameOver = false;

        document.querySelectorAll(".cell").forEach(function(cell) {
            cell.textContent = "";
        });

        document.getElementById("message").textContent =
            "Player X's turn";
    }
</script>

</body>
</html>
