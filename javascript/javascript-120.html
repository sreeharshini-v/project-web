<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to JavaScript Programs</a>
</nav>


<div class="container">

    <h1>Currency Converter</h1>

    <input type="number" id="amount"
           placeholder="Enter amount">

    <label>From:</label>

    <select id="from">
        <option value="USD">USD - US Dollar</option>
        <option value="INR">INR - Indian Rupee</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
    </select>

    <label>To:</label>

    <select id="to">
        <option value="INR">INR - Indian Rupee</option>
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
    </select>

    <button onclick="convertCurrency()">
        Convert
    </button>

    <div id="result"></div>

</div>

<script>
    async function convertCurrency() {

        let amount =
            Number(document.getElementById("amount").value);

        let from =
            document.getElementById("from").value;

        let to =
            document.getElementById("to").value;

        let result =
            document.getElementById("result");

        if (amount <= 0) {
            result.textContent =
                "Please enter a valid amount.";
            return;
        }

        if (from === to) {
            result.textContent =
                amount + " " + from +
                " = " + amount + " " + to;
            return;
        }

        result.textContent = "Loading...";

        try {

            let url =
                "https://api.frankfurter.dev/v2/rate/" +
                from.toLowerCase() + "/" +
                to.toLowerCase();

            let response = await fetch(url);

            if (!response.ok) {
                throw new Error("Currency rate unavailable.");
            }

            let data = await response.json();

            let converted =
                amount * data.rate;

            result.textContent =
                amount + " " + from +
                " = " +
                converted.toFixed(2) +
                " " + to;

        } catch (error) {

            result.textContent =
                "Error: " + error.message;
        }
    }
</script>

</body>
</html>
