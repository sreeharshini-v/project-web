<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Controlled Game</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        #gameArea {
            width: 600px;
            height: 400px;
            border: 3px solid black;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
            background-color: #f2f2f2;
        }

        #player {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: absolute;
            left: 275px;
            top: 175px;
        }
    </style>
</head>

<body>

<h2>Keyboard Controlled Game</h2>

<p>
    Use Arrow Keys to move the blue box.
</p>

<div id="gameArea">

    <div id="player"></div>

</div>

<script>
let player = document.getElementById("player");
let gameArea = document.getElementById("gameArea");

let x = 275;
let y = 175;

let speed = 10;

document.addEventListener("keydown", function(event) {

    let maxX = gameArea.clientWidth - player.clientWidth;
    let maxY = gameArea.clientHeight - player.clientHeight;

    if (event.key === "ArrowUp") {
        y -= speed;
    }

    if (event.key === "ArrowDown") {
        y += speed;
    }

    if (event.key === "ArrowLeft") {
        x -= speed;
    }

    if (event.key === "ArrowRight") {
        x += speed;
    }

    // Prevent player from leaving game area
    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    player.style.left = x + "px";
    player.style.top = y + "px";

});
</script>

</body>
</html>
