<!DOCTYPE html>
<html>
<head>
    <title>Double Click Event</title>

    <style>
        #box {
            width: 300px;
            height: 200px;
            background-color: lightblue;
            margin: 50px auto;
            text-align: center;
            padding-top: 80px;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Double-Click Event</h2>

<div id="box">
    Double-click me
</div>

<p id="output"></p>

<script>
document.getElementById("box").addEventListener(
    "dblclick",
    function() {

        this.style.backgroundColor = "lightgreen";

        document.getElementById("output").innerHTML =
            "Double-click event detected!";
    }
);
</script>

</body>
</html>
