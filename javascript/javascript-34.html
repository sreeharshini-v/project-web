<h2>Counter</h2>

<div id="count">0</div>

<button onclick="decrement()">-</button>
<button onclick="reset()">Reset</button>
<button onclick="increment()">+</button>

<script>
let count = 0;

function updateCount() {
    document.getElementById("count").innerHTML = count;
}

function increment() {
    count++;
    updateCount();
}

function decrement() {
    count--;
    updateCount();
}

function reset() {
    count = 0;
    updateCount();
}
</script>
