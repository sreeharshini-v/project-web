<!DOCTYPE html>
<html>
<head>
    <title>Colors Backgrounds Borders</title>

    <style>
        body {
            background-color: #eef5ff;
        }

        h1 {
            color: darkblue;
            background-color: lightyellow;
            border: 3px solid navy;
            padding: 15px;
            text-align: center;
        }

        p {
            color: white;
            background-color: #4caf50;
            border: 4px dashed red;
            padding: 20px;
            margin: 20px;
        }

        .box {
            background: linear-gradient(to right, lightblue, pink);
            border: 5px double purple;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <p>This paragraph demonstrates colors and borders.</p>

    <div class="box">Background and Border Example</div>

</body>
</html>
