<!DOCTYPE html>
<html>
<head>
    <title>Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
        }

        ol {
            list-style-type: upper-roman;
        }

        table {
            width: 70%;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: navy;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eee;
        }
    </style>
</head>
<body>

    <h1>CSS Lists</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <ol>
        <li>Login</li>
        <li>Register</li>
        <li>Logout</li>
    </ol>

    <h1>CSS Table</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>HTML</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Anu</td>
            <td>CSS</td>
            <td>85</td>
        </tr>
    </table>

</body>
</html>
