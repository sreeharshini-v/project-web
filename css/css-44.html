<!DOCTYPE html>
<html>
<head>
    <title>Object Fit</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
        }

        img {
            width: 250px;
            height: 200px;
            border: 3px solid black;
        }

        .cover {
            object-fit: cover;
            object-position: center;
        }

        .contain {
            object-fit: contain;
            background: #eee;
        }

        .top {
            object-fit: cover;
            object-position: top;
        }
    </style>
</head>
<body>

<div class="container">
    <img class="cover" src="https://picsum.photos/500/300?1">
    <img class="contain" src="https://picsum.photos/500/300?2">
    <img class="top" src="https://picsum.photos/500/300?3">
</div>

</body>
</html>
