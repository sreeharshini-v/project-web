<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        .image {
            float: left;
            width: 150px;
            height: 150px;
            background-color: lightblue;
            margin: 10px;
        }

        .clear {
            clear: both;
            background-color: lightgreen;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Float and Clear</h1>

    <div class="image">Float Box</div>

    <p>
        This text flows around the floated element.
        Float is commonly used to position elements beside text.
    </p>

    <div class="clear">
        This section uses clear: both.
    </div>

</body>
</html>
