<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <style>
        * {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .box {
            background: lightgreen;
        }

        #special {
            color: red;
        }

        input[type="text"] {
            border: 3px solid purple;
        }

        h1, p {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Selectors Demonstration</h1>

<p class="box">Class Selector</p>

<p id="special">ID Selector</p>

<input type="text" placeholder="Attribute Selector">

</body>
</html>
