<!DOCTYPE html>
<html>
<head>
    <title>Responsive Footer</title>
    <style>
        footer {
            background: #222;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 40px;
        }

        footer div {
            padding: 10px;
        }

        @media(max-width:600px) {
            footer {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<h1>Website Content</h1>

<footer>
    <div>
        <h3>About</h3>
        <p>About our company</p>
    </div>

    <div>
        <h3>Links</h3>
        <p>Home</p>
        <p>Services</p>
    </div>

    <div>
        <h3>Contact</h3>
        <p>Email: example@mail.com</p>
    </div>
</footer>

</body>
</html>
