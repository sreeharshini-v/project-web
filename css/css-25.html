<!DOCTYPE html>
<html>
<head>
    <title>Website Homepage</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            background: linear-gradient(120deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 100px 20px;
        }

        .hero button {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
        }

        .services {
            display: flex;
            gap: 20px;
            padding: 40px;
            justify-content: center;
        }

        .service {
            padding: 30px;
            background: #eee;
            text-align: center;
            flex: 1;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media(max-width:600px) {
            header,
            .services {
                flex-direction: column;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to CSS Programs</a>
</nav>


<header>
    <h2>My Website</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to Our Website</h1>
    <p>Learn, Create and Grow With Us</p>
    <button>Get Started</button>
</section>

<section class="services">
    <div class="service">
        <h2>Web Design</h2>
        <p>Beautiful and modern websites.</p>
    </div>

    <div class="service">
        <h2>Development</h2>
        <p>Fast and responsive applications.</p>
    </div>

    <div class="service">
        <h2>Support</h2>
        <p>Professional technical support.</p>
    </div>
</section>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
