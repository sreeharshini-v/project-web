<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients</title>
    <style>
        .linear {
            height: 200px;
            background: linear-gradient(to right, blue, purple);
            color: white;
            padding: 30px;
        }

        .radial {
            height: 200px;
            background: radial-gradient(circle, yellow, orange, red);
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="linear">
    <h1>Linear Gradient</h1>
</div>

<br>

<div class="radial">
    <h1>Radial Gradient</h1>
</div>

</body>
</html>
