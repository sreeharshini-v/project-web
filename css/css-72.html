<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            font-size: 8vw;
        }

        h2 {
            font-size: 5vw;
        }

        p {
            font-size: 2vw;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
            }

            h2 {
                font-size: 28px;
            }

            p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<h1>Responsive Heading</h1>

<h2>Responsive Subheading</h2>

<p>
    This webpage demonstrates responsive typography.
    The text size changes according to the screen width.
</p>

</body>
</html>
