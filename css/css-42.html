<!DOCTYPE html>
<html>
<head>
    <title>Button Animation</title>
    <style>
        button {
            padding: 15px 35px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            transition: 0.4s;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px gray;
            background: purple;
        }
    </style>
</head>
<body>

<button>Hover Me</button>

</body>
</html>
