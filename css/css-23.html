<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .card {
            width: 300px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px #aaa;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .price {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://picsum.photos/300/220?random=1">
    <div class="card-content">
        <h2>Smart Watch</h2>
        <p>Modern smartwatch with multiple features.</p>
        <div class="price">₹2,999</div>
        <br>
        <button>Buy Now</button>
    </div>
</div>

</body>
</html>
