<!DOCTYPE html>
<html>
<head>
    <title>Border Radius</title>
    <style>
        .square {
            width: 150px;
            height: 150px;
            background: blue;
            border-radius: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background: red;
            border-radius: 50%;
        }

        .pill {
            width: 250px;
            padding: 30px;
            background: green;
            color: white;
            border-radius: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Rounded Square</h2>
<div class="square"></div>

<h2>Circle</h2>
<div class="circle"></div>

<h2>Pill</h2>
<div class="pill">Pill Shape</div>

</body>
</html>
