    <title>Transitions and Transformations</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: blue;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 100px;
            transition: all 0.5s ease;
        }

        .box:hover {
            transform: rotate(20deg) scale(1.3);
            background-color: red;
        }
    </style>
