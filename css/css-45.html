<!DOCTYPE html>
<html>
<head>
    <title>Responsive Gallery</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .gallery img {
            width: calc(25% - 15px);
            height: 200px;
            object-fit: cover;
        }

        @media(max-width:800px) {
            .gallery img {
                width: calc(50% - 15px);
            }
        }

        @media(max-width:500px) {
            .gallery img {
                width: 100%;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">

</nav>
