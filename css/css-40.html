<!DOCTYPE html>
<html>
<head>
    <title>Image Hover</title>
    <style>
        .container {
            width: 400px;
            margin: 50px auto;
            overflow: hidden;
        }

        img {
            width: 100%;
            display: block;
            transition: 0.5s;
        }

        img:hover {
            transform: scale(1.2);
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://picsum.photos/400/300">
</div>

</body>
</html>
