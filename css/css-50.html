<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: sticky;
            top: 0;
            background: #222;
            color: white;
            padding: 20px;
            z-index: 10;
        }

        section {
            height: 500px;
            padding: 30px;
        }
    </style>
</head>
<body>

<header>
    <h2>Sticky Header</h2>
</header>

<section>
    <h1>Section 1</h1>
    <p>Scroll down.</p>
</section>

<section>
    <h1>Section 2</h1>
</section>

<section>
    <h1>Section 3</h1>
</section>

</body>
</html>
