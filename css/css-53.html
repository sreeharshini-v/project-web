<!DOCTYPE html>
<html>
<head>
    <title>Login Signup</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
        }

        .container {
            display: flex;
            width: 800px;
            max-width: 95%;
            margin: 50px auto;
            background: white;
            box-shadow: 0 0 15px #aaa;
        }

        .form {
            flex: 1;
            padding: 35px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: blue;
            color: white;
            border: none;
        }

        @media(max-width:600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to CSS Programs</a>
</nav>


<div class="container">

    <div class="form">
        <h2>Login</h2>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>

    <div class="form">
        <h2>Sign Up</h2>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Create Account</button>
    </div>

</div>

</body>
</html>
