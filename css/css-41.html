<!DOCTYPE html>
<html>
<head>
    <title>Tooltip</title>
    <style>
        .tooltip {
            position: relative;
            display: inline-block;
            margin: 100px;
            padding: 15px;
            background: blue;
            color: white;
        }

        .text {
            visibility: hidden;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            color: white;
            padding: 10px;
            width: 180px;
            text-align: center;
        }

        .tooltip:hover .text {
            visibility: visible;
        }
    </style>
</head>
<body>

<div class="tooltip">
    Hover Me
    <span class="text">This is a tooltip!</span>
</div>

</body>
</html>
