<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>
        body {
            height: 1500px;
            font-family: Arial;
        }

        .static {
            position: static;
            background: lightblue;
            padding: 20px;
        }

        .relative {
            position: relative;
            left: 50px;
            background: lightgreen;
            padding: 20px;
        }

        .container {
            position: relative;
            height: 150px;
            background: #ddd;
        }

        .absolute {
            position: absolute;
            top: 50px;
            right: 30px;
            background: orange;
            padding: 20px;
        }

        .fixed {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: red;
            color: white;
            padding: 15px;
        }

        .sticky {
            position: sticky;
            top: 0;
            background: purple;
            color: white;
            padding: 15px;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="static">Static Position</div>

    <div class="relative">Relative Position</div>

    <div class="container">
        <div class="absolute">Absolute Position</div>

    <div class="fixed">Fixed Position</div>
