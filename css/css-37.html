<!DOCTYPE html>
<html>
<head>
    <title>Display Properties</title>
    <style>
        .block {
            display: block;
            background: lightblue;
            padding: 10px;
        }

        .inline {
            display: inline;
            background: yellow;
        }

        .inline-block {
            display: inline-block;
            background: lightgreen;
            padding: 20px;
            margin: 10px;
        }

        .none {
            display: none;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">

<a href="index.html" style="text-decoration:none;font-weight:700;">Back to CSS Programs</a>
</nav>


<div class="block">Block Element</div>

<span class="inline">Inline Element</span>

<div class="inline-block">Inline Block</div>

<p class="none">This element is hidden using display:none.</p>

</body>
</html>
