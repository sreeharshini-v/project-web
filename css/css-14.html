<!DOCTYPE html>
<html>
<head>
    <title>Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
            background-color: #eee;
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: steelblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>CSS Flexbox</h1>

    <div class="container">
        <div class="box">One</div>
        <div class="box">Two</div>
        <div class="box">Three</div>
        <div class="box">Four</div>
    </div>

</body>
</html>
