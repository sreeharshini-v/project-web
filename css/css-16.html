    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            padding: 50px;
            background-color: lightblue;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .box {
                background-color: lightgreen;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
