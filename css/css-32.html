<!DOCTYPE html>
<html>
<head>
    <title>CSS Shadows</title>
    <style>
        .box {
            width: 300px;
            padding: 50px;
            margin: 50px auto;
            text-align: center;
            background: white;
            box-shadow: 10px 10px 20px gray;
        }

        h1 {
            text-shadow: 3px 3px 5px gray;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Shadow Effects</h1>
    <p>Box shadow and text shadow</p>
</div>

</body>
</html>
