<!DOCTYPE html>
<html>
<head>
    <title>Font and Text Formatting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            color: darkblue;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
            letter-spacing: 2px;
            word-spacing: 5px;
            text-transform: capitalize;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Font Properties</h1>

    <p>
        CSS provides many properties for controlling fonts and text formatting.
    </p>

</body>
</html>
