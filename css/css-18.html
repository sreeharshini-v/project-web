<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation</title>

    <style>
        .ball {
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 50%;
            position: relative;
            animation: move 3s infinite alternate;
        }

        @keyframes move {
            from {
                left: 0;
                transform: rotate(0deg);
            }

            to {
                left: 500px;
                transform: rotate(360deg);
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
