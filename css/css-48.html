<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        aside {
            background: #ddd;
            padding: 30px;
        }

        main {
            background: #eee;
            padding: 30px;
        }

        @media(max-width:600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to CSS Programs</a>
</nav>


<div class="container">

    <aside>
        <h2>Sidebar</h2>
        <p>Menu Item 1</p>
        <p>Menu Item 2</p>
    </aside>

    <main>
        <h1>Main Content</h1>
        <p>This is a two-column CSS Grid layout.</p>
    </main>

</div>

</body>
</html>
