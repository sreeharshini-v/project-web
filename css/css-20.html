<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 50px;
        }

        section {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .skills {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .skill {
            background-color: royalblue;
            color: white;
            padding: 15px 25px;
            border-radius: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Portfolio</h1>
        <p>Web Developer | Student | Programmer</p>
    </header>

    <section>
        <h2>About Me</h2>
        <p>
            Hello! I am a student interested in web development
            and programming.
        </p>

        <h2>My Skills</h2>

        <div class="skills">
            <div class="skill">HTML</div>
            <div class="skill">CSS</div>
            <div class="skill">JavaScript</div>
            <div class="skill">Python</div>
        </div>

        <h2>Projects</h2>
        <p>Student Management System</p>
        <p>Weather Dashboard</p>
        <p>Personal Portfolio</p>
    </section>

    <footer>
        © 2026 My Portfolio
    </footer>

</body>
</html>
