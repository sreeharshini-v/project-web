<!DOCTYPE html>
<html>
<head>
    <title>Keyframe Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background: red;

            position: relative;

            animation-name: moveBox;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes moveBox {
            0% {
                left: 0;
                top: 0;
                background: red;
            }

            50% {
                left: 300px;
                top: 100px;
                background: blue;
            }

            100% {
                left: 600px;
                top: 0;
                background: green;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
