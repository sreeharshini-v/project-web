<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode</title>

    <style>
        :root {
            --background: white;
            --text: #222;
            --card: #eeeeee;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: var(--background);
            color: var(--text);
        }

        .dark {
            --background: #121212;
            --text: white;
            --card: #222;
        }

        .container {
            padding: 50px;
            text-align: center;
        }

        .card {
            padding: 30px;
            background: var(--card);
            margin: 20px;
        }

        .dark-mode {
            padding: 12px 20px;
            background: black;
            color: white;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to CSS Programs</a>
</nav>


<div class="container">

    <h1>Dark Mode Website</h1>

    <p>
        The page uses CSS custom properties for its colors.
    </p>

    <div class="card">
        <h2>Sample Card</h2>
        <p>This card changes with the theme.</p>
    </div>

    <button class="dark-mode"
            onclick="document.body.classList.toggle('dark')">
        Toggle Dark Mode
    </button>

</div>

</body>
</html>
