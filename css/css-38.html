<!DOCTYPE html>
<html>
<head>
    <title>Visibility</title>
    <style>
        .visible {
            background: green;
            color: white;
            padding: 20px;
        }

        .hidden {
            visibility: hidden;
            background: red;
            padding: 20px;
        }

        .none {
            display: none;
        }
    </style>
</head>
<body>

<div class="visible">Visible Element</div>

<div class="hidden">Visibility Hidden</div>

<div class="none">Display None</div>

<p>The hidden element still occupies space.</p>

</body>
</html>
