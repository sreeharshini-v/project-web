<!DOCTYPE html>
<html>
<head>
    <title>Opacity</title>
    <style>
        .box {
            width: 250px;
            height: 150px;
            background: blue;
            margin: 20px;
            padding: 30px;
            color: white;
        }

        .half {
            opacity: 0.5;
        }

        .transparent {
            background: rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="box">Normal</div>

<div class="box half">50% Opacity</div>

<div class="box transparent">Transparent Background</div>

</body>
</html>
