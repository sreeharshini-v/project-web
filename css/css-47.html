<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 70px 1fr;
            min-height: 100vh;
        }

        header {
            grid-column: 1 / 3;
            background: #222;
            color: white;
            padding: 20px;
        }

        aside {
            background: #eee;
            padding: 20px;
        }

        main {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: lightblue;
            padding: 30px;
        }

        @media(max-width:700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            header {
                grid-column: 1;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to CSS Programs</a>
</nav>


<div class="dashboard">

    <header>
        <h2>Admin Dashboard</h2>
    </header>

    <aside>
        <h3>Menu</h3>
        <p>Dashboard</p>
        <p>Users</p>
        <p>Reports</p>
        <p>Settings</p>
    </aside>

    <main>
        <h1>Dashboard</h1>

        <div class="cards">
            <div class="card">Users: 1200</div>
            <div class="card">Orders: 450</div>
            <div class="card">Revenue: ₹50,000</div>
        </div>
    </main>

</div>

</body>
</html>
