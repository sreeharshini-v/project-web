<!DOCTYPE html>
<html>
<head>
    <title>Three Column Flexbox</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
        }

        .column {
            flex: 1;
            background: lightblue;
            padding: 40px;
            text-align: center;
        }

        @media(max-width:600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>

</nav>

</html>
