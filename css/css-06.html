<!DOCTYPE html>
<html>
<head>
    <title>Width Height</title>

    <style>
        .box1 {
            width: 300px;
            height: 150px;
            background-color: lightblue;
        }

        .box2 {
            width: 50%;
            min-width: 200px;
            max-width: 600px;
            height: 100px;
            background-color: lightgreen;
        }

        .box3 {
            width: 80vw;
            height: 20vh;
            background-color: pink;
        }

        div {
            margin: 20px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Sizing Properties</h1>

    <div class="box1">Fixed Width and Height</div>

    <div class="box2">Percentage Width</div>

    <div class="box3">Viewport Width and Height</div>

</body>
</html>
