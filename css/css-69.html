<!DOCTYPE html>
<html>
<head>
    <title>Sliding Card Animation</title>

    <style>
        .container {
            width: 300px;
            margin: 100px auto;
            overflow: hidden;
        }

        .card {
            width: 300px;
            padding: 50px;
            background: royalblue;
            color: white;
            text-align: center;

            animation: slide 3s infinite alternate;
        }

        @keyframes slide {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(0);
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>
<a href="index.html" style="text-decoration:none;font-weight:700;">Back to CSS Programs</a>
</nav>


<h1>Sliding Card</h1>

<div class="container">
    <div class="card">
        <h2>Welcome</h2>
        <p>This card slides into view.</p>
    </div>
</div>

</body>
</html>
