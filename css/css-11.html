<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Elements</title>

    <style>
        h1::before {
            content: "★ ";
            color: orange;
        }

        h1::after {
            content: " ★";
            color: orange;
        }

        p::first-letter {
            font-size: 40px;
            color: red;
        }

        p::first-line {
            font-weight: bold;
            color: blue;
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>

    <h1>Pseudo Elements</h1>

    <p>
        CSS pseudo-elements allow us to style specific parts of an element.
        They can also add content before or after an element.
    </p>
