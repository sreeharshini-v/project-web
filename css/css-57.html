<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .product {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 20px;
        }

        button {
            background: #2874f0;
            color: white;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Online Store</h1>
    <p>Shop Your Favorite Products</p>
</header>

<div class="products">

    <div class="product">
        <img src="https://picsum.photos/300/200?1">
        <h2>Headphones</h2>
        <p class="price">₹1,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/300/200?2">
        <h2>Smart Watch</h2>
        <p class="price">₹2,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/300/200?3">
        <h2>Camera</h2>
        <p class="price">₹25,000</p>
        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
