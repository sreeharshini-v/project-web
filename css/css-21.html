        body {
            font-family: Arial;
            background-color: #eef2f3;

        .profile {
            width: 600px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;

        h1 {
            color: navy;

        }

        .info {
            margin: 15px 0;
            padding: 12px;
            background-color: #f2f2f2;

        }

        .skills span {
            display: inline-block;
            background-color: blue;
            color: white;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 15px;
        }
    </style>
<link rel="stylesheet" href="style.css">
