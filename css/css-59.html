<!DOCTYPE html>
<html>
<head>
    <title>News Blog</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }

        article, aside {
            background: white;
            padding: 25px;
        }

        article {
            margin-bottom: 20px;
        }

        .featured {
            grid-column: 1 / 3;
            background: #dbeafe;
        }

        @media(max-width:700px) {
            .layout {
                grid-template-columns: 1fr;
                margin: 15px;
            }

            .featured {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Daily News</h1>
    <p>Latest News and Stories</p>
</header>

<div class="layout">

    <article class="featured">
        <h1>Featured News</h1>
        <p>This is today's featured news story.</p>
    </article>

    <main>
        <article>
            <h2>Technology News</h2>
            <p>Latest developments in technology.</p>
        </article>

        <article>
            <h2>Education News</h2>
            <p>Updates from the education sector.</p>
        </article>
    </main>

    <aside>
        <h2>Popular Posts</h2>
        <p>Post 1</p>
        <p>Post 2</p>
        <p>Post 3</p>
    </aside>

</div>

</body>
</html>
