<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
    <style>
        form {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #f2f2f2;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
        }

        button {
            padding: 12px 30px;
            background: green;
            color: white;
            border: none;
        }

        @media(max-width:500px) {
            form {
                margin: 20px;
            }
        }
    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">

</nav>


<form>
    <h1>Contact Us</h1>

    <input type="text" placeholder="Your Name">

    <input type="email" placeholder="Your Email">

    <input type="text" placeholder="Subject">

    <textarea placeholder="Your Message"></textarea>

    <button>Send Message</button>
</form>

</body>
</html>
