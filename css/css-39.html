<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Menu</title>
    <style>
        .menu {
            position: relative;
            display: inline-block;
        }

        .button {
            background: blue;
            color: white;
            padding: 15px;
        }

        .content {
            display: none;
            position: absolute;
            background: white;
            box-shadow: 0 5px 10px gray;
            min-width: 150px;
        }

        .content a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: black;
        }

        .content a:hover {
            background: #eee;
        }

        .menu:hover .content {
            display: block;
        }
    </style>
</head>
<body>

<div class="menu">
    <div class="button">Courses ▼</div>

    <div class="content">
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>
</div>

</body>
</html>
