<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        .header {
            background-color: navy;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .box {
            flex: 1;
            padding: 40px;
            background-color: lightblue;
            text-align: center;
        }

        /* Mobile devices */
        @media screen and (max-width: 600px) {

            .container {
                flex-direction: column;
            }

            .header {
                font-size: 18px;
            }

            .box {
                padding: 20px;
            }
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Responsive Website</h1>
    </div>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of webpage</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Style of webpage</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Functionality of webpage</p>
        </div>

    </div>

</body>
</html>
