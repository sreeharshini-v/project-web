<!DOCTYPE html>
<html>
<head>
    <title>Internal and External CSS</title>

    <link rel="stylesheet" href="style.css">

    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>CSS Demonstration</h1>

    <p>This paragraph is styled using internal CSS.</p>

    <div class="box">
        This box is styled using external CSS.
    </div>

</body>
</html>


.box {
    background-color: lightgreen;
    border: 2px solid green;
    padding: 20px;
    margin: 30px;
    text-align: center;
}
