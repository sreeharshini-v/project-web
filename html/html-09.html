    <h1>HTML5 Form</h1>

    <form>

        <label>Email:</label>
        <input type="email" required>
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Age:</label>
        <input type="number" min="1" max="100">
        <br><br>

        <label>Password:</label>
        <input type="password" required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
