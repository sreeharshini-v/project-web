<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>

    <style>
        table {
            border-collapse: collapse;
            width: 90%;
        }

        th, td {
            border: 2px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        .break {
            background-color: lightgray;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>College Timetable</h1>

    <table>

        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 11:30</th>
            <th>11:30 - 12:30</th>
            <th>12:30 - 1:30</th>
            <th>1:30 - 2:30</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td rowspan="5" class="break">BREAK</td>
            <td>JavaScript</td>
            <td rowspan="5" class="break">LUNCH</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Python</td>
            <td>Java</td>
            <td>HTML</td>
            <td>CSS</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>JavaScript</td>
            <td>Python</td>
            <td>Java</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>CSS</td>
            <td>HTML</td>
            <td>Python</td>
            <td>JavaScript</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Java</td>
            <td>Python</td>
            <td>CSS</td>
            <td>HTML</td>
        </tr>

    </table>

</body>
</html>
