<!DOCTYPE html>
<html>
<head>
    <title>Images and Hyperlinks</title>
</head>
<body>

    <h1>Images and Links</h1>

    <h2>Image</h2>

    <img src="https://via.placeholder.com/300"
         alt="Sample Image"
         width="300">

    <h2>Hyperlinks</h2>

    <p>
        Visit
        <a href="https://www.google.com" target="_blank">
            Google
        </a>
    </p>

    <p>
        Visit
        <a href="https://www.wikipedia.org" target="_blank">
            Wikipedia
        </a>
    </p>

</body>
</html>
