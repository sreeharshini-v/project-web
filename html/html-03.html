<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h1>Student Marks</h1>

    <table>
        <tr>
            <th colspan="3">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="2">Rahul</td>
            <td>HTML</td>
            <td>90</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>JavaScript</td>
            <td>92</td>
        </tr>
    </table>

</body>
</html>
