<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        /* Element selector */
        h1 {
            color: blue;
            font-family: Arial;
        }

        /* Class selector */
        .paragraph {
            color: green;
            font-size: 18px;
        }

        /* ID selector */
        #special {
            color: red;
            font-weight: bold;
        }

        .box {
            border: 3px solid black;
            padding: 20px;
            margin: 30px;
            background-color: lightyellow;
        }

    </style>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Selectors</h1>

    <p class="paragraph">
        This paragraph uses a class selector.
    </p>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

    <div class="box">
        This box demonstrates margin, padding,
        border and background color.
    </div>

</body>
</html>
