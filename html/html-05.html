<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="assignment-navigation" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin:0 0 20px;background:#eef2ff;border-radius:10px;">
<a href="../index.html" style="text-decoration:none;font-weight:700;">Home</a>

    <h1>Student Registration Form</h1>

    <form>

        <label>Full Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <label>Course:</label>
        <select name="course">
            <option>BCA</option>
            <option>B.Sc</option>
            <option>B.Tech</option>
            <option>MCA</option>
        </select>
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" value="reading"> Reading
        <input type="checkbox" value="sports"> Sports
        <input type="checkbox" value="music"> Music
        <br><br>

        <label>Address:</label><br>
        <textarea rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
